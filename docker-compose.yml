services:
  memento-mori:
    image: plantsoup/insta:latest
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./:/app/workspace
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
      - HOST=0.0.0.0
    command: serve --port 8080 --host 0.0.0.0 --output /app/output --search-dir /app/workspace --auto-build
